name: Frontend CI/CD

on:
  pull_request:
    branches: ["dev", "stage", "main"]
  push:
    branches: ["dev", "stage", "main"]

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Node
        uses: actions/setup-node@v3
        with:
          node-version: "20"
          cache: "npm"

      - name: Select target environment
        run: |
          TARGET_BRANCH="${GITHUB_BASE_REF:-$GITHUB_REF_NAME}"

          case "${TARGET_BRANCH}" in
            dev)
              echo "BUILD_ENV=dev" >> "$GITHUB_ENV"
              ;;
            stage)
              echo "BUILD_ENV=stage" >> "$GITHUB_ENV"
              ;;
            main)
              echo "BUILD_ENV=prod" >> "$GITHUB_ENV"
              ;;
            *)
              echo "Unsupported branch: ${TARGET_BRANCH}" >&2
              exit 1
              ;;
          esac

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # Essential for your validatePublicEnv function
          VITE_BUILD_ENVIRONMENT: ${{ env.BUILD_ENV }}
          VITE_FALLBACK_ENVIRONMENT: ${{ env.BUILD_ENV }}
          # Providing defaults so the validator doesn't crash the build
          VITE_APP_HOST_DEV: vidyatrack-dev.vercel.app
          VITE_APP_HOST_STAGE: vidyatrack-stage.vercel.app
          VITE_APP_HOST_PROD: vidyatrack.vercel.app
          VITE_API_BASE_URL_DEV: https://vidyatrack-api-dev.onrender.com
          VITE_API_BASE_URL_STAGE: https://vidyatrack-api-stage.onrender.com
          VITE_API_BASE_URL_PROD: https://vidyatrack-api.onrender.com
          VITE_FEATURE_PLATFORM_MANAGEMENT_DEV: "true"
          VITE_FEATURE_PLATFORM_MANAGEMENT_STAGE: "true"
          VITE_FEATURE_PLATFORM_MANAGEMENT_PROD: "true"
          VITE_FEATURE_TEACHER_COMMUNICATIONS_DEV: "true"
          VITE_FEATURE_TEACHER_COMMUNICATIONS_STAGE: "true"
          VITE_FEATURE_TEACHER_COMMUNICATIONS_PROD: "true"
          VITE_FEATURE_STUDENT_NOTES_DEV: "true"
          VITE_FEATURE_STUDENT_NOTES_STAGE: "true"
          VITE_FEATURE_STUDENT_NOTES_PROD: "true"
        run: |
          npm run build:${{ env.BUILD_ENV }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || github.ref_name == 'stage' && 'staging' || 'development' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Node
        uses: actions/setup-node@v3
        with:
          node-version: "20"
          cache: "npm"

      - name: Select target environment
        run: |
          case "${GITHUB_REF_NAME}" in
            dev)
              echo "BUILD_ENV=dev" >> "$GITHUB_ENV"
              ;;
            stage)
              echo "BUILD_ENV=stage" >> "$GITHUB_ENV"
              ;;
            main)
              echo "BUILD_ENV=prod" >> "$GITHUB_ENV"
              ;;
            *)
              echo "Unsupported branch: ${GITHUB_REF_NAME}" >&2
              exit 1
              ;;
          esac

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build with Vercel
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VITE_BUILD_ENVIRONMENT: ${{ env.BUILD_ENV }}
          VITE_FALLBACK_ENVIRONMENT: ${{ env.BUILD_ENV }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy to Vercel
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
