name: Frontend CI/CD

on:
  push:
    branches: ["dev", "stage", "main"]

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Node
        uses: actions/setup-node@v3
        with:
          node-version: "20"
          cache: "npm"

      - name: Select target environment
        run: |
          case "${GITHUB_REF_NAME}" in
            dev) echo "BUILD_ENV=dev" >> "$GITHUB_ENV" ;;
            stage) echo "BUILD_ENV=stage" >> "$GITHUB_ENV" ;;
            main) echo "BUILD_ENV=prod" >> "$GITHUB_ENV" ;;
          esac

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ "${{ env.BUILD_ENV }}" = "prod" ]; then
            vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          else
            vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
          fi

      - name: Build with Vercel
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          # Essential Build Context
          VITE_BUILD_ENVIRONMENT: ${{ env.BUILD_ENV }}
          VITE_FALLBACK_ENVIRONMENT: ${{ env.BUILD_ENV }}
          # Verified Backend URL
          VITE_API_BASE_URL_DEV: https://vidyatrack-backend-dev.onrender.com
          VITE_API_BASE_URL_STAGE: https://vidyatrack-backend-dev.onrender.com
          VITE_API_BASE_URL_PROD: https://vidyatrack-backend-dev.onrender.com
          # Application Hosts
          VITE_APP_HOST_DEV: vidyatrack-frontend.vercel.app
          VITE_APP_HOST_STAGE: vidyatrack-frontend.vercel.app
          VITE_APP_HOST_PROD: vidyatrack-frontend.vercel.app
          # Feature Flags (Restored)
          VITE_FEATURE_PLATFORM_MANAGEMENT_DEV: "true"
          VITE_FEATURE_PLATFORM_MANAGEMENT_STAGE: "true"
          VITE_FEATURE_PLATFORM_MANAGEMENT_PROD: "true"
          的高级 VITE_FEATURE_TEACHER_COMMUNICATIONS_DEV: "true"
          VITE_FEATURE_TEACHER_COMMUNICATIONS_STAGE: "true"
          VITE_FEATURE_TEACHER_COMMUNICATIONS_PROD: "true"
          VITE_FEATURE_STUDENT_NOTES_DEV: "true"
          VITE_FEATURE_STUDENT_NOTES_STAGE: "true"
          VITE_FEATURE_STUDENT_NOTES_PROD: "true"
        run: |
          if [ "${{ env.BUILD_ENV }}" = "prod" ]; then
            vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
          else
            vercel build --token=${{ secrets.VERCEL_TOKEN }}
          fi

      - name: Deploy to Vercel
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ "${{ env.BUILD_ENV }}" = "prod" ]; then
            vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
          else
            vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}
          fi
